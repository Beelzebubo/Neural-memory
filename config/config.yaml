consolidator:
  max_memories: 5000
  prune_strategy: by_importance
  similarity_threshold: 0.85
embedder:
  model_name: all-MiniLM-L6-v2
logging:
  file: logs/lino.log
  level: INFO
retriever:
  default_k: 10
  hybrid_alpha: 0.5
  min_score: 0
server:
  cors_origins: '*'
  host: 127.0.0.1
  port: 8210
  workers: 2
vault:
  sync_interval_hours: 6
