consolidator:
  max_memories: 5000
  prune_strategy: importance
embedder:
  device: cpu
  model_name: all-MiniLM-L6-v2
logging:
  file: logs/neural_memory.log
  level: INFO
retriever:
  default_k: 10
  hybrid_alpha: 0.5
  min_score: 0.0
store:
  backend: faiss
  index_type: flat_ip
  persistence:
    auto_save: true
    save_interval: 50
    save_path: data/memory_store.pkl
