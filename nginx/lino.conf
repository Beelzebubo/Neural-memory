# Lino — Nginx Reverse Proxy Config
# Place in /etc/nginx/sites-available/lino
# Then: sudo ln -s /etc/nginx/sites-available/lino /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name lino.local;

    # Hardening
    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Max upload for memory imports
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://127.0.0.1:8210;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
